name: Deploy Day 002 portfolio

on:
  push:
    branches: [main]
    paths:
      - '002/site/**'
      - '.github/workflows/002-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: '002/site'
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
