[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-template-starter"
version = "0.1.0"
description = "A small, reproducible scikit-learn project template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ml-template = "ml_template.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
